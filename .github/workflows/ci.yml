name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MBX_TARGET_VIEWS: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install project tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.10.22
          install_args: rust github:nextest-rs/nextest mr-boxington github:bahdotsh/wrkflw
          cache: false

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run checks
        run: mise run --skip-tools check

      - name: Preserve property regression seeds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: |
            spillover/proptest-regressions/merge.txt
            spillover/proptest-regressions/dedup_controls.txt
            spillover/proptest-regressions/sorter.txt
            spillover-bio/proptest-regressions/sort_pipeline.txt
          if-no-files-found: ignore
